<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="국내외 경제 뉴스를 광범위하게 수집하고 AI로 중요도를 선별해 보여주는 뉴스 모니터링 서비스입니다.">
    <meta name="keywords" content="글로벌 경제, 국내 경제, 뉴스 수집, 뉴스 선별, KOSPI, KOSDAQ, 파이낸셜 터미널">
    <meta property="og:title" content="Economics News">
    <meta property="og:description" content="국내외 경제 뉴스 광범위 수집 및 중요도 선별 모니터링">
    <meta property="og:type" content="website">
    <title>Economics News</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Roboto:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Financial Terminal Header -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-section">
                <!-- [2026-09-02] Was a "clear cache" button - now a manual collect/read-only
                     mode toggle (see toggleCollectMode in app.js). Red = 국내뉴스/해외뉴스
                     button clicks will re-collect via the paid API; blue = read-only,
                     buttons just show the last saved DB result. -->
                <div id="logo-icon" class="logo-icon" onclick="toggleCollectMode()" style="cursor: pointer;" title="파란색: 저장된 뉴스 보기 / 빨간색: 클릭 시 새로 수집">
                    <i class="fa-solid fa-chart-line-up"></i>
                </div>
                <div class="brand-text">
                    <h1 class="app-title">GLOBAL MACRO <span class="highlight">News</span></h1>
                </div>
            </div>

            <!-- Real-time Global Market Clocks -->
            <div class="market-clocks-bar">
                <div class="clock-card" id="clock-ny">
                    <div class="clock-header">
                        <span class="city-name"><i class="fa-solid fa-building-columns"></i> New York</span>
                        <span class="market-status status-open" id="status-ny">OPEN</span>
                    </div>
                    <div class="clock-time" id="time-ny">--:--:-- EST</div>
                </div>



                <div class="clock-card" id="clock-seoul">
                    <div class="clock-header">
                        <span class="city-name"><i class="fa-solid fa-city"></i> Seoul</span>
                        <span class="market-status status-open" id="status-seoul">OPEN</span>
                    </div>
                    <div class="clock-time" id="time-seoul">--:--:-- KST</div>
                </div>

                <!-- [2026-09-02] Moved here from header-actions (was btn-open-toss-macro-modal
                     in the button row) - now styled as a clock-card to sit next to Seoul,
                     per user request. Click behavior (openTossMacroModal) unchanged. -->
                <div class="clock-card" id="clock-macro" onclick="openTossMacroModal()" style="cursor: pointer;">
                    <div class="clock-header">
                        <span class="city-name"><i class="fa-solid fa-globe"></i> 경제 지표</span>
                        <span class="market-status status-open" style="background: rgba(0,210,255,0.1); color: #00d2ff; border-color: rgba(0,210,255,0.3);">Live</span>
                    </div>
                    <div class="clock-time" style="font-size: 0.9rem;">실시간 거시지표</div>
                </div>
            </div>

            <!-- Header Quick Control Actions -->
            <!-- [2026-09-02] btn-open-toss-macro-modal moved out (now clock-macro above).
                 btn-domestic-news moved in from the market-clocks-bar (was domestic-news-card,
                 opened a modal) - now styled like btn-run-simulation and, on click, replaces
                 the #shortlist-section content with domestic news instead of opening a modal
                 (see toggleDomesticNewsPanel in app.js). -->
            <div class="header-actions" style="display: flex; gap: 10px; width: 100%;">
                <button id="btn-domestic-news" class="btn btn-secondary glow-btn" style="padding: 10px; border-radius: 8px; border: 1px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" title="국내 6대 경제지 24시간 파급력 TOP 10">
                    <span class="live-beacon"></span>
                    <i class="fa-solid fa-newspaper"></i>
                    <span class="btn-text" style="font-weight: bold;">국내뉴스</span>
                </button>
                <button id="btn-run-simulation" class="btn btn-secondary glow-btn" style="padding: 10px; border-radius: 8px; border: 1px solid #00d2ff; background: rgba(0, 210, 255, 0.1); color: #00d2ff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;" title="실시간 파이프라인 데이터 재수집 및 파이프라인 재실행">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span class="btn-text" style="font-weight: bold;">해외뉴스</span>
                </button>
            </div>
        </div>
    </header>



    <!-- Mobile Drawer Backdrop Overlay -->
    <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop hidden"></div>

    <!-- Main Content Layout (Sidebar + News Content) -->
    <div class="main-wrapper">
        <div class="main-layout">
            

            <!-- Right Main Area: Hero Issue & News List Grid -->
            <main class="content-area">
                
                <!-- Swipeable Quick Stock Chip Bar (Mobile & Responsive Top Bar) -->


                <!-- Shortlist Section: screening-stage results (news_shortlist), shown
                     before/without paid deep analysis - see api/get-shortlist.js -->
                <section class="news-list-section" id="shortlist-section">
                    <div class="news-list-header">
                        <div class="title-with-count">
                            <h2 id="shortlist-section-title"><i class="fa-solid fa-newspaper"></i> 오늘의 선별 뉴스</h2>
                            <span class="badge-count" id="shortlist-count-badge">0개</span>
                        </div>
                    </div>
                    <div class="shortlist-grid" id="shortlist-grid" style="display:flex; flex-direction:column; gap:10px;">
                        <!-- Shortlist items dynamically injected by app.js -->
                    </div>
                    <div class="no-results hidden" id="shortlist-no-results">
                        <p>오늘 선별된 뉴스가 아직 없습니다.</p>
                    </div>
                </section>

            </main>
        </div>
    </div>

    <!-- Real-time Toss Macro Fullscreen Modal (Independent Container) -->
    <div id="toss-macro-modal" class="modal-backdrop hidden">
        <div class="modal-card toss-macro-modal-card">
            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-meta-pills">
                        <span class="live-beacon"></span>
                        <span class="badge-category"><i class="fa-solid fa-globe text-blue"></i> 글로벌 거시경제 & 주요 시장 지표</span>
                        <span class="modal-source-time" id="toss-modal-update-time">--시 --분</span>
                    </div>
                    <h2 class="modal-main-title">🌐 글로벌 거시경제 & 주요 시장 지표</h2>
                    <p class="modal-sub-title">코스피, 코스닥, 원/달러 환율, 원자재, 미 국채 금리, VIX, 글로벌 주요 선물지수 상하 그리드 뷰</p>
                </div>
                <button id="toss-modal-close" class="modal-close-btn" aria-label="Close modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="toss-macro-grid-container" id="toss-macro-grid-modal-container">
                    <div class="ticker-loading">
                        <i class="fa-solid fa-spinner fa-spin text-blue"></i> 실시간 매크로 지표 연결 중...
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span class="disclaimer-text"><i class="fa-solid fa-circle-info"></i> 100% 실시간 주요 글로벌 거시경제 지표 시세입니다.</span>
                <button id="toss-modal-footer-close" class="btn btn-secondary">닫기</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script src="app.js"></script>
</body>
</html>
