<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>서비스 종료</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f5f5f5; color: #222; padding: 16px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #ddd; } }
  main { text-align: center; max-width: 420px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0; line-height: 1.6; opacity: .8; }
</style>
</head>
<body>
<main>
  <h1>서비스가 종료되었습니다</h1>
  <p>뉴스 수집·분석은 텔레그램 뉴스 알림으로 통합되었습니다.</p>
</main>
</body>
</html>
