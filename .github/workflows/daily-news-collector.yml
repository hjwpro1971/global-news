name: ⏰ Daily Global Financial News Impact Collector (KST 06:00 AM)

on:
  schedule:
    # KST 아침 06:00 = UTC 21:00 (전날 밤 9시)
    - cron: '0 21 * * *'
  workflow_dispatch: # 필요시 GitHub 웹에서 수동 실행 가능 버튼

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🚀 Run Daily News Collection & AI Impact Analysis
        run: |
          echo "Starting Daily News Pipeline at KST 06:00 AM..."
          node scripts/fetch-and-analyze-news.js

      - name: 💾 Commit & Push Updated Daily Top 10 News Data
        run: |
          git config --global user.name "bkit-automated-bot"
          git config --global user.email "bot@bkit-vibecoding.ai"
          git add data/daily-top10-news.json app.js || true
          git diff-index --quiet HEAD || (git commit -m "chore(data): Auto-update daily Top 10 news impact data [KST 06:00 AM]" && git push)
